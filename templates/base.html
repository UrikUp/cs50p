{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>{% block title %}CS50P{% endblock %}</title>

  {% block extra_head %}{% endblock %}

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <link rel="stylesheet" href="{% static 'base.css' %}">
  <link rel="stylesheet" href="{% static 'layout.css' %}">

</head>

<body>

  <!-- MOBILE NAVBAR -->

  <nav class="navbar navbar-dark d-lg-none">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'home' %}">
        CS50P
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar"
        aria-controls="sidebar">
        <span class="navbar-toggler-icon"></span>

      </button>
    </div>
  </nav>


  <div class="d-flex flex-grow-1 overflow-hidden">

    <!-- SIDEBAR -->
    <div id="sidebar" class="offcanvas-lg offcanvas-start sidebar flex-shrink-0 text-white" tabindex="-1">
      <!-- DESKTOP HEADER -->
      <div class="sidebar-header d-none d-lg-block">

        <a class="sidebar-logo" href="{% url 'home' %}">
          CS50P
        </a>

        <div class="sidebar-subtitle">
          неофициальная адаптация
        </div>
      </div>
      <!-- MOBILE HEADER -->
      <div id="offcanvas" class="offcanvas-header border-bottom border-secondary d-lg-none">
        <h5 class="offcanvas-title mb-0">
          CS50P
        </h5>
        <button data-bs-target="#sidebar" type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"
          aria-label="Close">
        </button>
      </div>
      <!-- NAVIGATION -->
      <div class="offcanvas-body p-3">
        <ul class="nav flex-column sidebar-nav">
          {% for lecture in sidebar_pages %}
          <li class="nav-item">
            <a class="sidebar-link" href="{% url 'week' lecture.order %}">
              <span class="sidebar-number">
                {{ forloop.counter0 }}.
              </span>
              <span class="sidebar-title">
                {{ lecture.title }}
              </span>
            </a>
          </li>
          {% endfor %}
        </ul>
      </div>
    </div>
    <!-- MAIN CONTENT -->
    <main class=" p-4 markdown-body" style="max-width: 80rem;">

      {% block content %}
      {% endblock %}

    </main>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</body>

</html>
