# docker-compose.yml
services:
  web:
    build: .
    command:
    - gunicorn
    - App.wsgi:application
    - --bind
    - 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file: .env           
    environment:
      DJANGO_SETTINGS_MODULE: App.settings.prod
    depends_on:
      db:
        condition: service_healthy   # wait for DB properly

  db:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 5

volumes:
  postgres_data:
